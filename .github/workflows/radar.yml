# Planification du radar (spec §1.3 : 2x/jour, digest le matin).
# GitHub Actions plutot que launchd : le poste de travail peut etre eteint a 6h.
name: radar

on:
  schedule:
    # Heures UTC. En heure d'ete francaise : 06h00, 07h30 et 18h00 Paris.
    - cron: '0 4 * * *'
    - cron: '30 5 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RADAR_DIGEST_FROM: ${{ secrets.RADAR_DIGEST_FROM }}
      RADAR_DIGEST_TO: ${{ secrets.RADAR_DIGEST_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Ingestion
        if: github.event.schedule != '30 5 * * *'
        run: npm run ingest

      # Reprise unique a +30 min en cas d'echec (spec §1.3).
      - name: Reprise
        if: failure() && github.event.schedule != '30 5 * * *'
        run: sleep 1800 && npm run ingest

      - name: Expiration des avis depasses
        if: github.event.schedule == '30 5 * * *'
        run: npm run expire

      - name: Digest quotidien
        if: github.event.schedule == '30 5 * * *'
        run: npm run digest
