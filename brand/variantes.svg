<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" role="img" aria-label="Variantes de la marque RADAR">
  <title>Variantes A, B, C</title>

  <!-- A — chevrons libres -->
  <g transform="translate(0,0)">
    <g fill="none" stroke="#0F1826" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 42 L32 14 L59 42" opacity=".45"/>
      <path d="M13 42 L32 23 L51 42" opacity=".72"/>
      <path d="M22 42 L32 32 L42 42"/>
    </g>
    <circle cx="32" cy="47.5" r="4.8" fill="#C8552E"/>
  </g>

  <!-- B — chevrons dans un ecusson -->
  <g transform="translate(78,0)">
    <circle cx="32" cy="32" r="29" fill="#0F1826"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 39 L32 21 L50 39" opacity=".45"/>
      <path d="M23 39 L32 30 L41 39"/>
    </g>
    <circle cx="32" cy="45" r="3.6" fill="#C8552E"/>
  </g>

  <!-- C — balayage radar sur ligne de toiture -->
  <g transform="translate(156,0)">
    <g fill="none" stroke="#0F1826" stroke-linecap="round">
      <path d="M6 46 A26 26 0 0 1 58 46" stroke-width="4" opacity=".3"/>
      <path d="M15 46 A17 17 0 0 1 49 46" stroke-width="4" opacity=".55"/>
      <path d="M6 46 L58 46" stroke-width="4"/>
      <path d="M32 46 L52 29" stroke-width="4"/>
    </g>
    <circle cx="46" cy="34" r="4.2" fill="#C8552E"/>
  </g>
</svg>
